spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/pest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

pagehelper:
  reasonable: true
  helper-dialect: mysql

app:
  jwt:
    secret: ${JWT_SECRET:change-me-before-running}
    expire-ms: ${JWT_EXPIRE_MS:43200000}
  weather:
    api-host: ${QWEATHER_API_HOST:}
    api-key: ${QWEATHER_API_KEY:}
  camera-capture-dir: ${CAMERA_CAPTURE_DIR:captures}

